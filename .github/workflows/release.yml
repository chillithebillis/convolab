name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['package.json', 'src/**', 'build/**', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            dist: dist:mac
            files: dist/*.zip
          - os: windows-latest
            dist: dist:win
            files: dist/*-setup.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Check bundled ffmpeg encoders
        shell: bash
        run: |
          FF=$(node -p "require('ffmpeg-static')")
          "$FF" -hide_banner -encoders > enc.txt
          for e in prores_ks libx264 png aac; do grep -q " $e " enc.txt || { echo "missing encoder: $e"; exit 1; }; done
      - run: npm run ${{ matrix.dist }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v5
        with:
          name: convolab-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Version from package.json
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=v$(node -p "require('./package.json').version")
          echo "tag=$V" >> "$GITHUB_OUTPUT"
          if gh release view "$V" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v5
        if: steps.v.outputs.exists == 'false'
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        if: steps.v.outputs.exists == 'false'
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: out/*
          generate_release_notes: true
